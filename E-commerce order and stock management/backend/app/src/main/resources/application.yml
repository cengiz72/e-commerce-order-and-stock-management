spring:
  application:
    name: ecommerce-app

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/ecommerce
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ecommerce-app
      auto-offset-reset: earliest

server:
  port: 8080
